        resumen-ronda — plantilla del resumen de cierre de turno
        handoff       — cierre de sesión + estructura y cleanup de SPRINT.md
      CLAUDE.md pasó de 36506 a 16853 caracteres (-54%) y conserva solo lo que
      manda siempre: principios, comandos de verificación, convenciones de
      commit, branch policy y punteros a cada skill.
      Verificado que el contenido viajó por frases-ancla de cada sección
