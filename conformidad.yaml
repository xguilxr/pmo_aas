# ─────────────────────────────────────────────────────────────────────────────
# PRESUPUESTO DE CONTEXTO PERMANENTE  (MCA CTX-02)
#
# Sin esta cifra el entorno es N0, sin más análisis (MCA-P02 Etapa 1).
# `actual` es la medición del 2026-08-03; `max` es la meta de la Tanda 1.
# Ver docs/conformidad/plan.md acciones 5, 6 y 7.
