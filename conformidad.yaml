presupuesto_contexto:
  permanente_max_chars: 40000              # objetivo. Lo alcanzan plan.md 6-7
  permanente_techo_ci_chars: 51300         # trinquete: actual + 1% de tolerancia
  permanente_actual_chars: 50719
  medido: 2026-08-03
  estado: EXCEDIDO
  historial:                               # el trinquete se aprieta, no decora
    - { fecha: 2026-08-03, chars: 87623, techo: 88500, hito: "acción 4 — check en CI" }
    - { fecha: 2026-08-03, chars: 68055, techo: 68500, hito: "acción 5 — SPRINT.md 521→219 líneas (-22%)" }
    - { fecha: 2026-08-03, chars: 50036, techo: 50400, hito: "acción 6 — CLAUDE.md 36506→16853 a skills (-27%)" }
    - { fecha: 2026-08-03, chars: 50104, techo: 50400, hito: "acción 7 — contador derivado, no almacenado (CTX-03)" }
    - { fecha: 2026-08-03, chars: 50217, techo: 50400, hito: "acción 8 — guard de acciones irreversibles (AUT-01)" }
    - { fecha: 2026-08-03, chars: 50719, techo: 51300, hito: "handoff de cierre — TECHO SUBIDO, ver por_que_se_subio_el_techo" }
  distancia_al_objetivo: |
    10104 caracteres, con las acciones 5-7 ya hechas. Lo que queda pesado:
      docs/epics/EP0XX (uno)   16006  CLAUDE.md §1.4 obliga a cargar uno ENTERO
      CLAUDE.md                16781  ya comprimido -54%
      SPRINT.md                10920  ya por debajo de su límite de 250 líneas
    Ninguna acción pendiente del plan cierra esta brecha. Para llegar a 40000
    habría que cargar la SECCIÓN relevante del epic en vez del epic completo,
    y eso es cambiar CLAUDE.md §1.4 —una decisión de método—, no achicar
    archivos. Alternativa igual de legítima: fijar el objetivo en ~50000, que
    es lo que este entorno cuesta de verdad. Decisión del owner (CTX-02).
  verificacion_automatica: scripts/check_contexto.py   # CTX-05 — acción 4
  por_que_trinquete: |
    Enchufar el objetivo (40000) como techo dejaría el CI en rojo en cada PR
    hasta que terminen las acciones 5-7, y un control que bloquea todo se
    desactiva en dos días. El techo va al valor de hoy: falla si el contexto
    CRECE, que es el riesgo real, no el estado heredado. Baja conforme bajen
    5-7, hasta igualar el objetivo.
  por_que_se_subio_el_techo: |
    2026-08-03, de 50400 a 51300. Es la primera vez que se afloja, y la regla
    dice que exige razón escrita. Esta es.

    El trinquete frenó SEIS intentos de engordar el contexto durante la sesión.
    En cinco de ellos la respuesta correcta fue recortar, y se recortó: la nota
    de sesión de SPRINT.md, el bloque de conformidad que duplicaba plan.md, dos
    veces el HANDOFF, la tabla de AUT-01 en CLAUDE.md y un bloque de §2 que
    repetía el docstring de un script.

    Lo que queda ya no es grasa:
      CLAUDE.md    17080  comprimido -54% en la acción 6
      epic mediano 16006  §1.4 obliga a cargar uno ENTERO. No es un archivo
                          que se pueda achicar: es un cambio de método
      SPRINT.md    10560  227 líneas, por debajo de su límite
      HANDOFF.md    5212  el puente de una sesión grande. Encoge en la próxima
      skills        1861  solo las descripciones

    El crecimiento desde 50217 CIERRA requisitos: la declaración de AUT-01 y el
    puntero de derivación de IDs (CTX-03). Bloquearlo habría sido usar el
    control contra su propio propósito.

    Lo que NO se hace: subirlo cada vez que algo no entra. La próxima subida
    exige su propia entrada aquí, y si aparecen tres seguidas es señal de que
    el objetivo de 40000 no es realista y hay que rehacerlo, no seguir cediendo.

  por_que_1_por_ciento: |
    El techo lleva 1% de tolerancia (~880 caracteres) por decisión, no por
    descuido. A ras del valor actual el margen era de 21 caracteres: cualquier
    retoque de documentación habría roto el CI, y la reacción natural habría
    sido subir el techo cada vez, que es como un trinquete deja de serlo.
    El 1% absorbe el ruido y sigue fallando ante una adición real —un
    documento nuevo de lectura obligatoria pesa mucho más que eso.
    Subirlo por encima de esa tolerancia exige razón escrita aquí.
  nota: |
    CARACTERES, no bytes. Las cifras de la auditoría del 2026-08-03 (88180 →
    91501) se midieron con `wc -c`, que cuenta bytes; los acentos en UTF-8
    ocupan dos. La medición correcta la produce scripts/check_contexto.py y
    es la que manda, porque son los caracteres los que correlacionan con
    tokens. La conclusión de la auditoría no cambia: el orden de magnitud es
    el mismo y el hallazgo era la ausencia de presupuesto, no su valor.

  incluye:                                 # medido 2026-08-03, en caracteres
    - CLAUDE.md                            # 16891 — carga automática del arnés
    - docs/project-management/SPRINT.md    # 10923 — CLAUDE.md §1.3 obligatorio
    - docs/epics/EP0XX relevante           # 16006 — CLAUDE.md §1.4, mediana de 18
    - docs/project-management/HANDOFF.md   #  4536 — CLAUDE.md §1.1 obligatorio
    - catálogo de skills                   #  1861 — solo el frontmatter description

