# ─────────────────────────────────────────────────────────────────────────────
# NO CONFORMIDADES ABIERTAS  (auditoría 2026-08-03)
# ─────────────────────────────────────────────────────────────────────────────

no_conformidades:
  - requisito: AUT-01
    marco: MCA
    estado: parcial
    gravedad: media
    hallazgo: |
      El control existe, está versionado y probado, pero NO se pudo demostrar
      que se ejecute. MCA-CORE §6.1: un control que existe y no se ejecuta es
      PARCIAL, nunca CONFORME.

      Qué hay: .claude/settings.json (permissions deny/ask) + hook PreToolUse
      sobre Bash que corre scripts/guard_irreversible.py. El guard mira el
      comando COMPLETO con regex, no por prefijo como `permissions`: así atrapa
      `git push origin main --force`, que una regla de prefijo deja pasar.

      Probado por tubería en los dos sentidos, 15 casos:
        git push --force (en cualquier posición)  -> deny
        --no-verify                               -> deny
        push a main (explícito o pelado en main)  -> deny
        --force-with-lease, alembic upgrade/
        downgrade, gh issue close, commit --amend,
        reset --hard, rm -rf, DROP TABLE          -> ask
        pytest, git status, push a branch propia  -> pasa
      Falso positivo detectado y corregido: `git push origin claude/x` estando
      en main ya no se bloquea; la regla del push pelado solo aplica cuando el
      comando no nombra un ref.

      Por qué PARCIAL: no se pudo demostrar que dispare, en dos intentos.

      Primera hipótesis (2026-08-03, DESCARTADA): «el vigilante no toma un
      settings creado a mitad de sesión». El owner abrió /hooks y el guard
      siguió sin interceptar, así que la causa era otra.

      Causa real: la sesión de auditoría tenía como directorio primario
      C:/Users/David Aguilar, no el repositorio. `.claude/settings.json` es
      configuración DEL PROYECTO y solo se carga en una sesión enraizada en él.
      Desde una sesión externa no se aplica, se abra /hooks o no.

      No es un defecto del control: es que no se puede verificar desde aquí.
    plan: |
      Prueba de aceptación: abrir Claude Code CON EL REPOSITORIO COMO DIRECTORIO
      DE TRABAJO (`cd .../pmo_aas` y arrancar ahí), y ejecutar un comando
      inofensivo que coincida con un patrón de bloqueo, p. ej.:
        echo "prueba: git push --force"
      Si queda interceptado, AUT-01 pasa a CONFORME sin tocar código.
      La ruta del hook usa ${CLAUDE_PROJECT_DIR:-.}, probada con y sin la
      variable definida, así que resuelve en cualquiera de los dos casos.
    fecha_objetivo: 2026-08-31

conformes_verificados:
  - requisito: CTX-03
    fecha: 2026-08-03
    evidencia: |
      Cero cifras vivas en el contexto permanente (CLAUDE.md, SPRINT.md,
      HANDOFF.md). Se retiraron las dos que la propia remediación había
      introducido: el conteo de tests y el de migraciones de CLAUDE.md §0.3.
      Ahora la tabla declara el CRITERIO (`exit 0`), que no envejece, y las
      mediciones fechadas viven en `mediciones` de este archivo.

      Verificado automáticamente por scripts/check_contexto.py::cifras_vivas,
      probado en cuatro escenarios:
        estado actual                          -> exit 0
        cifra en la tabla de CLAUDE.md §0.3    -> exit 1
        cifra en viñeta sin fecha              -> exit 1
        cifra en viñeta de changelog fechada   -> exit 0 (es registro, no estado)
    nota: |
      La primera versión del check tenía un punto ciego: buscaba una fecha en
      las 25 líneas previas, y el encabezado de §0.3 lleva fecha, así que
      amnistiaba toda esa tabla — justo donde el fallo había ocurrido. Se
      detectó porque la prueba negativa NO falló. Corregido: una fila de tabla
      nunca cuenta como registro, y fuera de tablas hay que encontrar la viñeta
      que la contiene y esa viñeta debe llevar la fecha.

  - requisito: CTX-02
    fecha: 2026-08-03
    evidencia: |
      presupuesto_contexto.permanente_max_chars: 40000, declarado en este
      archivo, en la raíz del repositorio y versionado. El requisito exige
      DECLARAR el presupuesto; no exige que el entorno quepa en él.
    salvedad: |
      No leer esto como que el entorno cabe en su presupuesto:
        declarado 40000 · real 50217 · excedido en 25%
      Y el 40000 lo propuso la auditoría, no el owner. Ninguna acción pendiente
      cierra la brecha: el epic mediano son 16006 caracteres y CLAUDE.md §1.4
      obliga a cargar uno entero por sesión. O cambia el método de carga de
      epics, o el objetivo se fija en lo que el entorno cuesta de verdad
      (~50000). Decisión del owner. Ver 2026-08-03-mca-seguimiento.md H-3.

  - requisito: FLU-02
    fecha: 2026-08-03
    evidencia: |
      CLAUDE.md §0.3 línea 125 declara la definición de terminado: lint exit 0,
      typecheck exit 0, tests API exit 0. El entorno la comprueba entera: un PR
      no pasa sin los jobs `lint`, `api-tests-smoke` y `web-typecheck` verdes.
      Salvedad: no hay un comando local único que devuelva un solo veredicto;
      es comodidad, no conformidad, porque CI sí lo hace.

  - requisito: CAP-01
    fecha: 2026-08-03
    evidencia: |
      Los procedimientos repetibles salieron del contexto permanente a
      artefactos invocables en .claude/skills/ (versionados: .gitignore
      excluye .claude/* salvo skills/):
        triage        — Fases A-B: discovery, plantilla de issue, labels
        cerrar-item   — Fases C-D: commit, comment de cierre, DoD end-to-end
        delegar       — cuándo y cómo delegar a sub-agentes
        resumen-ronda — plantilla del resumen de cierre de turno
        handoff       — cierre de sesión + estructura y cleanup de SPRINT.md
      CLAUDE.md pasó de 36506 a 16853 caracteres (-54%) y conserva solo lo que
      manda siempre: principios, comandos de verificación, convenciones de
      commit, branch policy y punteros a cada skill.
      Verificado que el contenido viajó por frases-ancla de cada sección
      movida (30 de 31; la restante es una paráfrasis, no una omisión).

  - requisito: CTX-04
    fecha: 2026-08-03
    evidencia: |
      Las instrucciones de alcance temático ya no se cargan siempre. El
      procedimiento de triage se carga al triagear, el de cierre al cerrar un
      item, el de delegación al delegar. Coste en contexto permanente: solo la
      `description` de cada skill (catálogo 319 -> 1861 caracteres), contra los
      19653 que se retiraron. Saldo neto: -18111.

  - requisito: CTX-05
    fecha: 2026-08-03
    evidencia: |
      scripts/check_contexto.py, enchufado al job `contexto-permanente` de
      .github/workflows/ci.yml (sin filtro de paths: corre en todo PR).
      Lee los umbrales de este archivo, no los duplica (CTX-06).
      Probado en los dos sentidos, que es lo que distingue un control de un
      adorno:
        estado actual                  -> exit 0
        techo bajado a 50000           -> exit 1, "87,280 > techo 50,000"
        techo SPRINT.md bajado a 300   -> exit 1, "521 líneas > techo 300"
        --informe con fallo activo     -> exit 0
    nota: |
      El job NO se ha ejecutado todavía en GitHub Actions: no hay push. La
      verificación es local, con el mismo Python 3.12 del runner.

  - requisito: FLU-03
    fecha: 2026-08-03
    evidencia: |
      El límite de 250 líneas de SPRINT.md, que CLAUDE.md §6 y §12 declaraban
      dos veces como «regla dura» y confiaban a que alguien invocara /handoff,
      ahora lo ejecuta CI. Era el ejemplo exacto del requisito: lo que debe
      ocurrir siempre estaba en prosa, no automatizado. Estaba en 521.

  - requisito: FLU-01
    fecha: 2026-08-03
    evidencia: |
      Los tres comandos ejecutables corren sin intervención y con resultado
      inequívoco en Windows limpio, sin librerías nativas de WeasyPrint:
        ruff check .                     -> exit 0
        pytest -q -n auto -m "not heavy" -> 778 passed, 1 skipped, exit 0 (12m57s)
        tsc --noEmit                     -> exit 0
      Antes: 774 passed / 4 failed / exit 1. Causa raíz corregida en
      tests/conftest.py: el stub de renderers cubría `render_pdf` en una lista
      de 3 módulos escrita a mano, y no cubría `html_to_pdf` en absoluto,
      mientras que los renderers los importan 6 módulos. Sustituida por un
      barrido de sys.modules, que no se desactualiza al añadir consumidores.
      Cobertura de render real preservada: test_us037_pdf_renderer.py (heavy,
      excluido del stub) más dos casos nuevos para html_to_pdf, que antes no
      tenía ninguno.
    nota: |
      Los 2 casos heavy nuevos NO se ejecutaron localmente: exigen GTK/Pango.
      Colectan (6 tests, exit 0) y corren en el job api-tests-heavy del CI.
  - requisito: HER-01
    evidencia: |
      .gitignore cubre .env / .env.local / .env.*.local; solo .env.example
      versionado. Barrido de AKIA…, sk-…, ghp_…, claves privadas y URIs
      postgres:// con credenciales sobre archivos versionados: cero coincidencias.

  - requisito: CTX-01
    fecha: 2026-08-03
    evidencia: |
      CLAUDE.md §0.3 declara stack, preparación del entorno, cinco comandos de
      verificación y tres rutas protegidas. Tres de los cinco ejecutados con
      salida registrada:
        ruff check .                    -> "All checks passed!" exit 0
        pytest -q -n auto -m "not heavy" -> 774 passed / 4 failed / 1 skipped,
                                            exit 1, 13m29s (fallos ambientales)
        tsc --noEmit                    -> sin salida, exit 0
      No ejecutados y declarados como tal: build web, migraciones Alembic
