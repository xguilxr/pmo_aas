  - requisito: FLU-03
    fecha: 2026-08-03
    evidencia: |
      El límite de 250 líneas de SPRINT.md, que CLAUDE.md §6 y §12 declaraban
      dos veces como «regla dura» y confiaban a que alguien invocara /handoff,
