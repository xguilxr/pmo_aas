  "2.7.1":
    estado: ACEPTADO
    evidencia: >-
      El correo es un factor **débil**: NIST 800-63B §5.1.3.1 dice que no debe
      usarse para autenticación fuera de banda porque no demuestra posesión de
      un dispositivo. Este control pide ofrecer primero una alternativa más
      fuerte, y no hay ninguna que ofrecer. Decisión del owner 2026-08-07,
      ADR-035, con el contraste delante. Lo que se acepta: si alguien tiene la
      contraseña Y el correo, el factor no lo detiene. Lo que sí detiene, que
      es la amenaza realista, es una contraseña reutilizada que aparece en una
      filtración.
  "2.7.2":
    estado: CUMPLE
    evidencia: >-
      `VIDA_MINUTOS = 10`, literal y no configurable: subirlo es exactamente lo
      que alguien haría para que dejara de molestar. Fijado en su suite, con un
      caso que caduca el código y comprueba que no entra.
  "2.7.3":
    estado: CUMPLE
    evidencia: >-
      Un solo uso (`used_at`) y atado a **su** desafío: el código de un inicio
      de sesión no vale para otro, y su suite lo comprueba con dos desafíos
      simultáneos. Sin eso, un código pedido en una pestaña completaría el
      inicio de sesión que otra persona empezó en otra parte.
  "2.7.4":
    estado: CUMPLE
    evidencia: >-
      El código sale por HTTPS a Resend y llega al buzón de la persona, que es
      un canal distinto del navegador donde escribió la contraseña. Se emite
      por la tarea de avisos de seguridad, que no pasa por las preferencias de
      notificación — un segundo factor que se apaga desde los ajustes no es un
      segundo factor.
  "2.8.1":
    estado: NO APLICA
    evidencia: >-
      Sigue sin aplicar, y el motivo cambió: el segundo factor de 4.3.1 ya
      existe, pero es un código enviado por correo y no un OTP **basado en
