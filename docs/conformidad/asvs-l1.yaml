      amenazas identificadas (SEG-06).
  "12.1.1":
    estado: CUMPLE
    evidencia: >-
      `MAX_DOC_BYTES` acota cada subida y el almacenamiento rechaza lo que lo
      supera.
  "12.3.1":
    estado: CUMPLE
    evidencia: >-
      `services/filename_slug.py` normaliza el nombre; la clave del objeto no
      la elige el usuario.
  "12.3.2":
    estado: CUMPLE
    evidencia: >-
      Ídem: el nombre entregado no se usa como ruta.
  "12.3.3":
    estado: CUMPLE
    evidencia: >-
      Ídem.
  "12.3.4":
    estado: CUMPLE
    evidencia: >-
      Las descargas van con `Content-Disposition: attachment` y nombre
      saneado.
  "12.3.5":
    estado: CUMPLE
    evidencia: >-
      El nombre nunca llega a una llamada al sistema.
  "12.4.1":
    estado: CUMPLE
    evidencia: >-
      Los archivos viven en almacenamiento de objetos (R2), fuera de cualquier
      raíz web.
  "12.4.2":
    estado: HUECO
    evidencia: >-
      No hay análisis antivirus de lo que se sube.
  "12.5.1":
    estado: CUMPLE
    evidencia: >-
      Lista blanca de extensiones en `document_storage` y en
      `branding_storage`.
  "12.5.2":
    estado: CUMPLE
    evidencia: >-
      El almacenamiento sirve con tipo declarado y `nosniff`; nada se ejecuta
      como HTML.
  "12.6.1":
    estado: CUMPLE
    evidencia: >-
      `core/url_externa.py` restringe los destinos a los que el servidor puede
      llamar.
  "13.1.1":
    estado: CUMPLE
    evidencia: >-
      Un solo analizador por capa: Starlette en el API y `fetch` en el
      navegador.
  "13.1.3":
    estado: CUMPLE
    evidencia: >-
      Ninguna ruta lleva clave ni token en la URL.
  "13.2.1":
    estado: CUMPLE
    evidencia: >-
      Cada ruta declara su método y su capacidad; no hay verbo abierto.
  "13.2.2":
    estado: CUMPLE
    evidencia: >-
      Pydantic valida el cuerpo contra el esquema antes de tocar la lógica.
  "13.2.3":
    estado: CUMPLE
    evidencia: >-
      El API no autentica por cookie: la cookie de refresco solo sirve en
      `/auth/refresh` y lleva `SameSite`.
  "13.3.1":
    estado: CUMPLE
    evidencia: >-
      El único XML que entra es el del importador de planes y pasa por
      `defusedxml` más validación de campos.
  "14.2.1":
    estado: CUMPLE
    evidencia: >-
      `pip-audit`, `bandit` y `pnpm audit` en el trabajo `seguridad` (INT-02),
      con pasivo declarado y fechado.
  "14.2.2":
    estado: CUMPLE
    evidencia: >-
      La imagen de producción no incluye herramientas de desarrollo ni datos
      de ejemplo.
  "14.2.3":
    estado: CUMPLE
    evidencia: >-
