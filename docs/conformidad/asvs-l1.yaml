  "8.3.2":
    estado: CUMPLE
    evidencia: >-
      Exportación en JSON (`GET /users/me/datos-personales`) y supresión por
      **anonimización** (`POST /users/me/datos-personales/suprimir`), decisión
      del owner en ADR-034: las filas se quedan y dejan de apuntar a nadie,
      porque el borrado físico choca con `audit_log` —de solo anexado por
      diseño, AM-08— y con el historial de los proyectos, que es dato del
      inquilino y no de la persona. El seudónimo es estable y no reversible.
      La supresión exige re-teclear el correo y cierra la sesión. Límite
      declarado, no fingido: el texto libre que menciona a alguien por su
      nombre no se barre. Cierra la carencia que
      `05-DATOS-PERSONALES.md` §5 llamaba «la más seria de este inventario».
      Suite `test_seg01_asvs832_datos_personales.py`.
  "8.3.3":
    estado: CUMPLE
    evidencia: >-
      Aviso de privacidad versionado (`services/aviso_privacidad.py`, seis
      apartados derivados del inventario de `05-DATOS-PERSONALES.md`) y
      aceptación explícita en el **primer inicio de sesión** — decisión del
      owner: no hay alta por autoservicio donde poner una casilla, porque las
      cuentas las crea un administrador. Se guarda fecha **y versión**: con
      solo la fecha, «aceptó» dice cuándo y no qué, y al cambiar el aviso no
      habría forma de saber a quién volver a preguntarle. Al subir la versión,
      la pantalla vuelve a salir. La versión la fija el servidor, no el
      cliente. Nulable a propósito: las cuentas anteriores al aviso no han
      aceptado nada y rellenarlas habría fabricado un consentimiento. Migración
      0105, suite `test_seg01_asvs833_consentimiento.py`.
