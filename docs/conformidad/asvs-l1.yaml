# MCS SEG-01 — mapeo del producto contra OWASP ASVS 4.0.3 nivel 1.
#
# Los 127 controles L1 del catálogo (`marco/asvs-4.0.3-L1.csv`), uno por uno.
# NO es un muestreo: el barrido `scripts/check_asvs.py` falla si falta alguno.
#
# Estados:
#   CUMPLE     — el producto lo hace, con la evidencia citada.
#   NO APLICA  — el control supone una tecnología o un flujo que el producto no
#                tiene. El motivo va escrito; «no aplica» sin motivo es un hueco
#                con otro nombre.
#   HUECO      — no se cumple. Sin excusas y sin reformular el control.
#
# Medición 2026-08-07: 97 CUMPLE · 13 NO APLICA · 2 ACEPTADO · 15 HUECO.
#
#   ACEPTADO   — no se cumple, y no se va a cumplir: hay una decisión escrita
#                detrás (ADR). NO se pinta como CUMPLE, porque un auditor
#                tiene derecho a ver la diferencia sin preguntar.

controles:
  "2.1.1":
    estado: ACEPTADO
    evidencia: >-
      La política exige 8 caracteres y ASVS L1 pide 12. Decisión del owner
      2026-08-07, ADR-032, con el contraste delante. Lo que contiene el riesgo
      hoy es bcrypt con coste configurable más el retardo creciente del inicio
      de sesión (escenario E-4), no la longitud.
  "2.1.2":
    estado: CUMPLE
    evidencia: >-
      Máximo declarado de 128 (`PASSWORD_POLICY_MAX_LEN`) y sin truncamiento
      por debajo: `bcrypt_sha256` resume antes de hashear. Antes «sin máximo»
      sonaba generoso mientras por detrás había uno de 72 bytes sin avisar.
  "2.1.3":
    estado: CUMPLE
    evidencia: >-
      `bcrypt_sha256` no trunca. Era un defecto real y comprobado: dos
      contraseñas de 103 y 108 caracteres con los mismos 72 primeros abrían la
      misma cuenta. `bcrypt` queda deprecado y no retirado, con re-escritura
      del hash en el siguiente inicio de sesión.
  "2.1.4":
    estado: CUMPLE
    evidencia: >-
      La política no restringe el juego de caracteres: solo exige presencia de
      mayúscula, dígito y símbolo.
