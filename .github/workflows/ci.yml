name: CI

on:
  # Solo push a main (post-merge, para api-tests-heavy + historial).
  # Push a branches claude/** NO dispara CI porque el PR correspondiente
  # ya lo dispara vía `pull_request` — evitamos dual runs + saves actions minutes.
  push:
    branches: [main]
  pull_request:

# ENH-033: cancelar runs previos del mismo PR/branch al pushear.
# En main no cancelamos (queremos historial completo post-merge).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ENH-033: job inicial que detecta qué paths cambiaron. Los demás
  # jobs usan sus outputs para saber si deben correr. Así un PR de
  # solo-frontend salta los jobs de api y viceversa, sin renunciar
  # a que un PR mixto corra todo.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `paths-filter` necesita historia suficiente para hacer
          # diff contra `base: main` en pushes a claude/** branches.
          # En PR events usa la API de GH y no necesita profundidad.
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `base: main` explícito: en push a branches que no son
          # PR (ej. claude/**), el action necesita el ref base para
          # hacer el diff. En PR detecta automáticamente.
          base: main
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/**'
            workflows:
              - '.github/workflows/**'

  # ENH-032: gate completo de ruff. Reglas seleccionadas en
  # apps/api/pyproject.toml (E,F,I,N,UP,B,A,C4,RUF) con `ignore`
  # documentado de las que se relajan post-cleanup masivo.
  lint:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Ruff check
        run: ruff check .

  # Smoke de tests: excluye `@pytest.mark.heavy` para PR path rápido.
  api-tests-smoke:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run smoke tests in parallel
        run: python -m pytest -q -n auto -m "not heavy"

  # Tests heavy (render real weasyprint/python-docx): solo en push a main.
  api-tests-heavy:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run heavy tests
        run: python -m pytest -q -m "heavy"

  web-typecheck:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install deps (pnpm)
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Typecheck
        run: pnpm --filter @pmoaas/web exec tsc --noEmit

  web-build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install deps (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build
        run: pnpm --filter @pmoaas/web build
