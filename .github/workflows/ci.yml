name: CI

on:
  # Solo push a main (post-merge, para api-tests-heavy + historial).
  # Push a branches claude/** NO dispara CI porque el PR correspondiente
  # ya lo dispara vía `pull_request` — evitamos dual runs + saves actions minutes.
  push:
    branches: [main]
  pull_request:

# ENH-033: permisos explícitos para que `dorny/paths-filter@v3` pueda
# usar la GH REST API en PR events (compare base vs head). Sin esto,
# el action falla con 403/404 según el tipo de PR (fork, same-repo).
permissions:
  contents: read
  pull-requests: read

# ENH-033: cancelar runs previos del mismo PR/branch al pushear.
# En main no cancelamos (queremos historial completo post-merge).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ENH-033: job inicial que detecta qué paths cambiaron. Los demás
  # jobs usan sus outputs para saber si deben correr. Así un PR de
  # solo-frontend salta los jobs de api y viceversa, sin renunciar
  # a que un PR mixto corra todo.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Sin `base` explícito + sin `fetch-depth: 0`: en PR events
          # `paths-filter` usa la GH REST API para comparar base vs
          # head (necesita `pull-requests: read` permission a nivel
          # workflow). En push a main compara contra el commit
          # previo (HEAD^) que viene con el checkout default.
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/**'
            workflows:
              - '.github/workflows/**'

  # Auditoría MCA 2026-08-03 — cierra CTX-05 (el presupuesto de contexto
  # permanente DEBE verificarse de forma automática) y FLU-03 (lo que deba
  # ocurrir siempre DEBE automatizarse, no confiarse a una instrucción).
  #
  # Sin filtro de paths a propósito: el contexto permanente lo mueve casi
  # cualquier cambio de docs, y el job tarda segundos.
  contexto-permanente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Presupuesto de contexto y límite de SPRINT.md
        run: python scripts/check_contexto.py

  # Auditoría MCS 2026-08-03 — cierra CFG-02 (el repositorio NO DEBE contener
  # secretos, y la ausencia DEBE verificarse automáticamente sobre el HISTORIAL
  # COMPLETO) e INT-02 (análisis estático de seguridad, dependencias vulnerables
  # y detección de secretos).
  #
  # Antes de esto el CI no tenía ninguna de las tres. Un secreto commiteado
  # llegaba a `main` sin que nada lo parase.
  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks necesita el historial entero: un secreto borrado en un
          # commit posterior sigue estando en el repositorio.
          fetch-depth: 0

      # CFG-02 — secretos, sobre todo el historial.
      - name: Detección de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # INT-02 — análisis estático de seguridad del backend.
      # Solo severidad media y alta: `-ll`. El ruido convierte un gate en algo
      # que se desactiva.
      - name: SAST Python (bandit)
        run: |
          pip install bandit==1.7.10
          bandit -r apps/api/app -ll

      # INT-02 — dependencias vulnerables de Python.
      #
      # Falla ante cualquier vulnerabilidad NUEVA. El pasivo conocido vive en
      # `.pip-audit-ignore`, cada entrada con razón escrita y fecha objetivo:
      # un gate rojo desde el primer PR se desactiva en dos días.
      - name: Dependencias vulnerables (pip-audit)
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r apps/api/requirements.txt --strict \
            $(grep -vE '^\s*#|^\s*$' apps/api/.pip-audit-ignore | sed 's/^/--ignore-vuln /')

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # INT-02 — dependencias vulnerables de JS. `--prod` porque una
      # vulnerabilidad en una herramienta de desarrollo no llega a producción.
      - name: Dependencias vulnerables (pnpm audit)
        run: pnpm audit --prod --audit-level high

  # ENH-032: gate completo de ruff. Reglas seleccionadas en
  # apps/api/pyproject.toml (E,F,I,N,UP,B,A,C4,RUF) con `ignore`
  # documentado de las que se relajan post-cleanup masivo.
  lint:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Ruff check
        run: ruff check .

  # Smoke de tests: excluye `@pytest.mark.heavy` para PR path rápido.
  api-tests-smoke:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run smoke tests in parallel
        run: python -m pytest -q -n auto -m "not heavy"

  # ENH-044: gate dedicado para migraciones contra Postgres efímero.
  # Caza regresiones tipo BUG-039 (SQLite acepta `sa.text("1")` como
  # boolean default; Postgres no). El workflow corre upgrade head →
  # downgrade base → upgrade head para validar reversibilidad.
  api-migrations-postgres:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pmo
          POSTGRES_PASSWORD: pmo
          POSTGRES_DB: pmo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmo -d pmo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: alembic upgrade head (Postgres limpio)
        env:
          DATABASE_URL: postgresql+psycopg://pmo:pmo@localhost:5432/pmo_test
        run: alembic upgrade head
      - name: alembic downgrade base (smoke reversibilidad)
        env:
          DATABASE_URL: postgresql+psycopg://pmo:pmo@localhost:5432/pmo_test
        run: alembic downgrade base
      - name: alembic upgrade head (re-aplicar)
        env:
          DATABASE_URL: postgresql+psycopg://pmo:pmo@localhost:5432/pmo_test
        run: alembic upgrade head

  # Tests heavy (render real weasyprint/python-docx): solo en push a main.
  api-tests-heavy:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run heavy tests
        run: python -m pytest -q -m "heavy"

  web-typecheck:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install deps (pnpm)
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Typecheck
        run: pnpm --filter @pmoaas/web exec tsc --noEmit

  web-build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install deps (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build
        run: pnpm --filter @pmoaas/web build
