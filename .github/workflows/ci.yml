name: CI

on:
  # Solo push a main (post-merge, para api-tests-heavy + historial).
  # Push a branches claude/** NO dispara CI porque el PR correspondiente
  # ya lo dispara vía `pull_request` — evitamos dual runs + saves actions minutes.
  push:
    branches: [main]
  pull_request:

# ENH-033: permisos explícitos para que `dorny/paths-filter@v3` pueda
# usar la GH REST API en PR events (compare base vs head). Sin esto,
# el action falla con 403/404 según el tipo de PR (fork, same-repo).
permissions:
  contents: read
  pull-requests: read

# ENH-033: cancelar runs previos del mismo PR/branch al pushear.
# En main no cancelamos (queremos historial completo post-merge).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ENH-033: job inicial que detecta qué paths cambiaron. Los demás
  # jobs usan sus outputs para saber si deben correr. Así un PR de
  # solo-frontend salta los jobs de api y viceversa, sin renunciar
  # a que un PR mixto corra todo.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Sin `base` explícito + sin `fetch-depth: 0`: en PR events
          # `paths-filter` usa la GH REST API para comparar base vs
          # head (necesita `pull-requests: read` permission a nivel
          # workflow). En push a main compara contra el commit
          # previo (HEAD^) que viene con el checkout default.
          filters: |
            api:
              - 'apps/api/**'
              - 'scripts/**'
              - '.github/workflows/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/**'
            workflows:
              - '.github/workflows/**'

  # Auditoría MCA 2026-08-03 — cierra CTX-05 (el presupuesto de contexto
  # permanente DEBE verificarse de forma automática) y FLU-03 (lo que deba
  # ocurrir siempre DEBE automatizarse, no confiarse a una instrucción).
  #
  # Sin filtro de paths a propósito: el contexto permanente lo mueve casi
  # cualquier cambio de docs, y el job tarda segundos.
  contexto-permanente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Presupuesto de contexto y límite de SPRINT.md
        run: python scripts/check_contexto.py

      # Auditoría MCS 2026-08-03 — cierra DOC-01 («todo documento DEBE declarar
      # responsable, estado, fecha de revisión y periodicidad»). Eran 0 de 64.
      #
      # Va en este job por lo mismo que `check_tokens` fue a `contraste-wcag`:
      # los dos miran documentación, tardan segundos y no dependen de qué
      # código cambió. Una verificación requerida más cuesta una acción del
      # owner sin añadir cobertura.
      - name: Encabezado documental (DOC-01)
        run: python scripts/check_docs.py

      # MCS INF-02 — la paridad de versiones declarada se respeta de verdad.
      #
      # Va aquí y no en un trabajo propio porque lee dos archivos de texto y
      # tarda milisegundos; una verificación requerida más cuesta una acción
      # del owner sin añadir cobertura. Mismo criterio que DOC-01.
      #
      # Sin filtro de paths a propósito: depende de `servicios-datos.yml` (raíz),
      # de este workflow y de `scripts/`, que caen en filtros distintos.
      - name: Paridad de versiones de los servicios de datos (INF-02)
        run: python scripts/check_entornos.py

  # Auditoría MCS R1 2026-08-04 — cierra DIS-02 (toda combinación semántica de
  # texto y fondo DEBE alcanzar WCAG 2.2 AA).
  #
  # El script existía desde la medición pero NO estaba enganchado, porque
  # entonces fallaba: 8 de 19 pares por debajo del mínimo. Un trinquete que
  # nace rojo se desactiva en dos días y deja de vigilar nada. Se engancha el
  # 2026-08-05, con los tokens ya retocados, y desde entonces protege el
  # arreglo — un contraste verificado a mano se rompe en el siguiente ajuste
  # de marca.
  #
  # Lee los valores de `globals.css` en vez de llevar una copia, que era el
  # otro agujero: un control que puede desincronizarse de lo que vigila no es
  # un control.
  #
  # Sin filtro de paths, igual que `contexto-permanente` y por el mismo motivo:
  # depende de dos archivos que caen en filtros distintos (`apps/web` y
  # `scripts`), tarda segundos, y un check requerido que se salta no bloquea el
  # merge — comprobado con el PR #576.
  contraste-wcag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contraste WCAG 2.2 AA de los tokens semánticos
        run: python scripts/check_contraste.py

      # Auditoría MCS 2026-08-03 — cierra DIS-01 y CFG-14 (los valores visuales
      # como tokens, sin literales de color ni de espaciado en componentes).
      #
      # Va como paso de ESTE job y no como uno propio a propósito: los dos
      # miran el mismo archivo por la misma razón —que la paleta esté en un
      # solo sitio y se use— y una verificación requerida más cuesta una acción
      # del owner en la protección de `main` sin añadir cobertura.
      - name: Tokens de diseño sin literales (DIS-01)
        run: python scripts/check_tokens.py

      # DIS-04 — un aviso destructivo nombra el objeto y dice su consecuencia.
      # Va en `contraste-wcag` porque es el job que ya mira `apps/web` sin
      # necesitar Node: el gate solo lee ficheros.
      - name: Avisos destructivos por la frontera (DIS-04)
        run: python scripts/check_confirmaciones.py

      # MCS DAT-11 — todo número de indicador declara su periodo y su frescura.
      # Va con los demás barridos de `apps/web`: lee archivos de texto y tarda
      # milisegundos.
      - name: Periodo y marca de actualización (DAT-11)
        run: python scripts/check_frescura.py

      # MCS DIS-03 — las tres fronteras de estado siguen enganchadas y ninguna
      # pantalla recorre una colección de la API sin tratar el caso vacío.
      - name: Los cinco estados por pantalla (DIS-03)
        run: python scripts/check_estados.py

  # Auditoría MCS 2026-08-03 — cierra CFG-02 (el repositorio NO DEBE contener
  # secretos, y la ausencia DEBE verificarse automáticamente sobre el HISTORIAL
  # COMPLETO) e INT-02 (análisis estático de seguridad, dependencias vulnerables
  # y detección de secretos).
  #
  # Antes de esto el CI no tenía ninguna de las tres. Un secreto commiteado
  # llegaba a `main` sin que nada lo parase.
  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks necesita el historial entero: un secreto borrado en un
          # commit posterior sigue estando en el repositorio.
          fetch-depth: 0

      # CFG-02 — secretos, sobre todo el historial.
      - name: Detección de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # INT-02 — análisis estático de seguridad del backend.
      # Solo severidad media y alta: `-ll`. El ruido convierte un gate en algo
      # que se desactiva.
      - name: SAST Python (bandit)
        run: |
          pip install bandit==1.7.10
          bandit -r apps/api/app -ll

      # INT-02 — dependencias vulnerables de Python.
      #
      # Falla ante cualquier vulnerabilidad NUEVA. El pasivo conocido vive en
      # `.pip-audit-ignore`, cada entrada con razón escrita y fecha objetivo:
      # un gate rojo desde el primer PR se desactiva en dos días.
      - name: Dependencias vulnerables (pip-audit)
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r apps/api/requirements.txt --strict \
            $(grep -vE '^\s*#|^\s*$' apps/api/.pip-audit-ignore | sed 's/^/--ignore-vuln /')

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # INT-02 — dependencias vulnerables de JS. `--prod` porque una
      # vulnerabilidad en una herramienta de desarrollo no llega a producción.
      - name: Dependencias vulnerables (pnpm audit)
        run: pnpm audit --prod --audit-level high

  # ENH-032: gate completo de ruff. Reglas seleccionadas en
  # apps/api/pyproject.toml (E,F,I,N,UP,B,A,C4,RUF) con `ignore`
  # documentado de las que se relajan post-cleanup masivo.
  lint:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Ruff check
        run: ruff check .

  # Auditoría MCS 2026-08-03 — cierra CFG-04 («los mensajes de commit DEBEN
  # seguir Conventional Commits»). El hábito ya estaba —37 de los últimos 40
  # cumplían— y el control no: `CLAUDE.md` §4 describe el formato, y una
  # convención descrita es una instrucción, no un control (MCA FLU-03).
  #
  # Solo sobre los commits del PR. La historia ya integrada no se reescribe, y
  # un gate que la revisara nacería rojo para siempre.
  #
  # Sin filtro de paths: los mensajes no dependen de qué archivos se tocaron.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Hace falta la historia para poder comparar contra la rama base.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conventional Commits en los commits del PR
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python scripts/check_commits.py --rango "origin/${{ github.base_ref }}..HEAD"

  # Auditoría MCS 2026-08-03 — cierra DEV-04 («el análisis estático y la
  # verificación de tipos DEBEN ejecutarse en modo estricto»). `ruff` cubría lo
  # primero y `tsc --noEmit` lo segundo en el frontend; en Python no había
  # ninguna verificación de tipos.
  #
  # Job propio y no un paso de `lint` por la misma razón que `evaluacion-ia`:
  # tiene que ser un check nombrable para exigirlo en la protección de `main`,
  # y su salida —qué huella nueva apareció— se lee sola.
  #
  # `mypy --strict` entero, con el pasivo heredado en `apps/api/.mypy-baseline`.
  # El porqué de la línea base está en el docstring de `check_tipos.py`.
  tipos-python:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements-dev.txt
      - name: mypy --strict contra la línea base
        run: python scripts/check_tipos.py

      # Auditoría MCS R1 — LEN-02. Los cinco textos por defecto ya dicen qué,
      # por qué y qué hacer; los 169 explícitos que quedan van por línea base y
      # se arreglan al tocar cada endpoint, que es lo que el plan preveía.
      # Va aquí y no en un job propio porque no necesita más que Python 3.12.
      - name: Mensajes de error con las tres partes (LEN-02)
        run: python scripts/check_mensajes.py

  # Smoke de tests: excluye `@pytest.mark.heavy` para PR path rápido.
  api-tests-smoke:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run smoke tests in parallel
        run: python -m pytest -q -n auto -m "not heavy"

  # Auditoría MCS 2026-08-03, acción B3 — cierra IA-07 («ninguna funcionalidad
  # de nivel agente DEBE desplegarse sin conjunto de evaluación previo») e IA-08
  # («DEBE existir un conjunto de evaluación ejecutado en la canalización, con
  # umbral que condicione el despliegue»).
  #
  # Job propio y no un test más dentro de `api-tests-smoke` por dos razones: el
  # umbral tiene que ser un check nombrable para exigirlo en la protección de
  # `main`, y su informe tiene que leerse solo, sin bucear en la salida de
  # pytest. La suite igualmente lo corre (tests/test_ia0709_evaluacion.py), que
  # es lo que hace que un invariante roto se vea en el mismo `pytest` local.
  #
  # Sin clave de API y sin red: los casos son salidas de modelo grabadas. Por
  # eso puede ser obligatorio y tardar segundos. Qué mide y qué no, en
  # apps/api/evaluacion/README.md.
  evaluacion-ia:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Conjunto de evaluación de IA (umbral en evaluacion/casos.yaml)
        run: python -m evaluacion.runner

  # ENH-044: gate dedicado para migraciones contra Postgres efímero.
  # Caza regresiones tipo BUG-039 (SQLite acepta `sa.text("1")` como
  # boolean default; Postgres no). El workflow corre upgrade head →
  # downgrade base → upgrade head para validar reversibilidad.
  api-migrations-postgres:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pmo
          POSTGRES_PASSWORD: pmo
          POSTGRES_DB: pmo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmo -d pmo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # Va ANTES de los tres pasos de esquema, y a propósito: necesita una base
      # sin las tablas que dependen de `tenants` por clave foránea, y se limpia
      # sola al terminar.
      #
      # Por qué existe este paso: un `upgrade head` sobre base limpia construye
      # el ESQUEMA, no ejerce las migraciones de DATOS — no hay filas que migrar.
      # El bucle de la 0101 recorría cero filas aquí, así que la primera versión
      # de esa migración (con `sa.text`, que Postgres rechaza y SQLite acepta)
      # habría pasado este job en verde. Esta suite siembra las filas que la base
      # limpia no tiene.
      - name: Migraciones de datos contra Postgres (con filas)
        env:
          DATABASE_URL_POSTGRES: postgresql+psycopg://pmo:pmo@localhost:5432/pmo_test
        run: pytest tests/test_dat06_migracion_0101.py -q
      - name: alembic upgrade head (Postgres limpio)
        env:
          DATABASE_URL: postgresql+psycopg://pmo:pmo@localhost:5432/pmo_test
        run: alembic upgrade head
      - name: alembic downgrade base (smoke reversibilidad)
        env:
          DATABASE_URL: postgresql+psycopg://pmo:pmo@localhost:5432/pmo_test
        run: alembic downgrade base
      - name: alembic upgrade head (re-aplicar)
        env:
          DATABASE_URL: postgresql+psycopg://pmo:pmo@localhost:5432/pmo_test
        run: alembic upgrade head

  # Tests heavy (render real weasyprint/python-docx): solo en push a main.
  api-tests-heavy:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run heavy tests
        run: python -m pytest -q -m "heavy"

  web-typecheck:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install deps (pnpm)
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Typecheck
        run: pnpm --filter @pmoaas/web exec tsc --noEmit

  web-build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install deps (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build
        run: pnpm --filter @pmoaas/web build
