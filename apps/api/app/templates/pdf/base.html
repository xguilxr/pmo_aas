<!doctype html>
<html lang="{{ lang|default('es') }}">
<head>
<meta charset="utf-8" />
<title>{{ title }}</title>
<style>
  @page {
    size: Letter;
    margin: 2cm 2cm 2.5cm 2cm;
    @top-left {
      content: "{{ tenant_name or '' }}";
      font-size: 9pt;
      color: #6b7280;
    }
    @top-right {
      content: "{{ title }}";
      font-size: 9pt;
      color: #6b7280;
    }
    @bottom-right {
      content: "Página " counter(page) " / " counter(pages);
      font-size: 9pt;
      color: #6b7280;
    }
    @bottom-left {
      content: "Generado {{ generated_at }}";
      font-size: 9pt;
      color: #9ca3af;
    }
  }

  :root {
    --chrome: #182e4e;
    --accent: #2563eb;
    --muted: #6b7280;
    --border: #e5e7eb;
    --danger: #dc2626;
    --warn: #eab308;
    --ok: #16a34a;
  }

  html, body {
    font-family: "DM Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 10.5pt;
    color: #111827;
    line-height: 1.45;
  }

  h1 { font-size: 20pt; color: var(--chrome); margin: 0 0 .2em; }
  h2 { font-size: 14pt; color: var(--chrome); margin: 1.2em 0 .3em; border-bottom: 1px solid var(--border); padding-bottom: .15em; }
  h3 { font-size: 11.5pt; color: #1f2937; margin: 1em 0 .2em; }

  .meta {
    color: var(--muted);
    font-size: 9.5pt;
    margin-bottom: 1.2em;
  }

  .kv { display: grid; grid-template-columns: max-content 1fr; column-gap: .6rem; row-gap: .2rem; }
  .kv dt { color: var(--muted); font-weight: 500; }
  .kv dd { margin: 0; }

  table { width: 100%; border-collapse: collapse; margin: .5em 0 1em; }
  th, td { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; font-size: 9.5pt; }
  th { background: #f9fafb; color: #374151; font-weight: 600; text-transform: uppercase; font-size: 8.5pt; letter-spacing: .04em; }

  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    font-size: 8.5pt; font-weight: 600;
  }
  .pill.green { background: #dcfce7; color: #166534; }
  .pill.yellow { background: #fef9c3; color: #854d0e; }
  .pill.red { background: #fee2e2; color: #991b1b; }
  .pill.gray { background: #f3f4f6; color: #374151; }

  /* ENH-110: indicador de salud solo-color (círculo, sin texto). */
  .dot {
    display: inline-block; width: 11px; height: 11px;
    border-radius: 999px; vertical-align: middle; background: #9ca3af;
  }
  .dot.green { background: #16a34a; }
  .dot.yellow { background: #ca8a04; }
  .dot.amber { background: #ca8a04; }
  .dot.red { background: #dc2626; }
  .dot.gray { background: #9ca3af; }

  .muted { color: var(--muted); }
  .small { font-size: 9pt; }
  .right { text-align: right; }
  .nums { font-variant-numeric: tabular-nums; }
  .page-break { page-break-before: always; }
  .empty { color: var(--muted); font-style: italic; font-size: 9.5pt; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
