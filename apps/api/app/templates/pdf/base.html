<!doctype html>
<html lang="{{ lang|default('es') }}">
<head>
<meta charset="utf-8" />
<title>{{ title }}</title>
<style>
  @page {
    size: Letter;
    margin: 2cm 2cm 2.5cm 2cm;
    @top-left {
      content: "{{ tenant_name or '' }}";
      font-size: 9pt;
      color: #6b7280;
    }
    @top-right {
      content: "{{ title }}";
      font-size: 9pt;
      color: #6b7280;
    }
    @bottom-right {
      content: "Página " counter(page) " / " counter(pages);
      font-size: 9pt;
      color: #6b7280;
    }
    @bottom-left {
      content: "Generado {{ generated_at }}";
      font-size: 9pt;
      color: #9ca3af;
    }
  }

  :root {
    /* ENH-146 — paleta alineada a la marca del producto (globals.css). */
    --chrome: #182e4e;        /* navy del chrome / títulos */
    --accent: #2A4DA0;        /* azul de marca (antes #2563eb) */
    --muted: #756f60;         /* texto-muted cálido de marca */
    --border: #e8e3d7;        /* hairline de marca */
    --danger: #C0392B;
    --warn: #B26B12;
    --ok: #1F8A5B;
    --surface: #ffffff;
    --app: #F4F6FA;
  }

  html, body {
    font-family: "DM Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 10.5pt;
    color: #111827;
    line-height: 1.45;
  }

  h1 { font-size: 20pt; color: var(--chrome); margin: 0 0 .2em; }
  h2 { font-size: 14pt; color: var(--chrome); margin: 1.2em 0 .3em; border-bottom: 1px solid var(--border); padding-bottom: .15em; }
  h3 { font-size: 11.5pt; color: #1f2937; margin: 1em 0 .2em; }

  .meta {
    color: var(--muted);
    font-size: 9.5pt;
    margin-bottom: 1.2em;
  }

  .kv { display: grid; grid-template-columns: max-content 1fr; column-gap: .6rem; row-gap: .2rem; }
  .kv dt { color: var(--muted); font-weight: 500; }
  .kv dd { margin: 0; }

  table { width: 100%; border-collapse: collapse; margin: .5em 0 1em; }
  th, td { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; font-size: 9.5pt; }
  th { background: #f9fafb; color: #374151; font-weight: 600; text-transform: uppercase; font-size: 8.5pt; letter-spacing: .04em; }

  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    font-size: 8.5pt; font-weight: 600;
  }
  .pill.green { background: #dcfce7; color: #166534; }
  .pill.yellow { background: #fef9c3; color: #854d0e; }
  .pill.red { background: #fee2e2; color: #991b1b; }
  .pill.gray { background: #f3f4f6; color: #374151; }

  .muted { color: var(--muted); }
  .small { font-size: 9pt; }
  .right { text-align: right; }
  .nums { font-variant-numeric: tabular-nums; }
  .page-break { page-break-before: always; }
  .empty { color: var(--muted); font-style: italic; font-size: 9.5pt; }

  /* ENH-146 — banda de marca (logo PMO + logo cliente). */
  .brand-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; margin: 0 0 1.1em; padding-bottom: .7em;
    border-bottom: 2px solid var(--chrome);
  }
  .brand-header .brand-pmo { display: flex; align-items: center; gap: .55rem; }
  .brand-header .brand-logo { max-height: 40px; max-width: 200px; object-fit: contain; }
  .brand-header .brand-name { font-weight: 600; font-size: 12pt; color: var(--chrome); }
  .brand-header .brand-client { max-height: 36px; max-width: 160px; }

  /* ENH-146 — banda de KPIs at-a-glance (compartida con el HTML inline). */
  .kpi-row { display: flex; flex-wrap: wrap; gap: 10px; margin: .4em 0 1.2em; }
  .kpi-card {
    flex: 1 1 0; min-width: 110px; border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; background: var(--surface);
  }
  .kpi-card .kpi-label {
    font-size: 7.5pt; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); font-weight: 600;
  }
  .kpi-card .kpi-value {
    font-size: 19pt; font-weight: 700; line-height: 1.05; color: var(--chrome);
    font-variant-numeric: tabular-nums; margin-top: 2px;
  }
  .kpi-card.danger { border-color: var(--danger); }
  .kpi-card.danger .kpi-value { color: var(--danger); }
  .kpi-card.warn { border-color: var(--warn); }
  .kpi-card.warn .kpi-value { color: var(--warn); }
  .kpi-card.ok { border-color: var(--ok); }
  .kpi-card.ok .kpi-value { color: var(--ok); }
  .kpi-card.accent { border-color: var(--accent); }
  .kpi-card.accent .kpi-value { color: var(--accent); }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
{% include "_brand_header.html" %}
{% block content %}{% endblock %}
</body>
</html>
