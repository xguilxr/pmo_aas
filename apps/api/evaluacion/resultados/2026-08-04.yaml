nota: 'Primera ejecución del conjunto (B3, MCS IA-07/08/09). Verificado por mutación:
  quitar el guardia de rutas del copiloto tira 5 casos; un constructor de acciones
  ingenuo, 8; la heurística del mapeo, 6; la tolerancia del parser, 3; el validador
  de RAID, 2; la neutralización del envoltorio, 1. Sin mutar, 0. Los dos defectos
  que encontró el conjunto al construirse (navegación fuera del sitio en el copiloto,
  y un field nulo del modelo borrando el acierto de la heurística) ya están corregidos,
  por eso EV-S-02/03 y EV-C-35 salen en verde.'
