[project]
name = "pmoaas-api"
version = "0.1.0"
description = "PMO-aaS FastAPI backend"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary — All Rights Reserved (see ../../LICENSE)" }
authors = [{ name = "David Eduardo Aguilar Guillen" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# ENH-031: session-scoped event loop para que fixtures async
# session-scoped (`_engine_session`) funcionen sin cross-loop issues.
# Todas las fixtures y tests comparten el mismo event loop durante
# toda la corrida de pytest.
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "heavy: tests que ejercen render real (weasyprint / python-docx) o hashing completo; job separado en CI (ENH-030)",
    "permissions: tests de matriz role × endpoint (US-079, gate de regresión post-DEC-024)",
    "con_segundo_factor: enciende el MFA de administración, que la suite apaga por defecto (ASVS 4.3.1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RUF"]
# ENH-032: relajamos reglas cosméticas o de refactor mayor para subir
# el bar del lint job sin bloquear PRs en cambios no relacionados. Lo
# que queda activo: errores reales (E9, F*), naming (N), import order
# (I), modernización segura (UP). Reglas suprimidas tienen ticket
# follow-up implícito si el owner quiere abordar cada categoría:
# - A002: builtin shadowing (arg `id`, `type`, `format`) — pervasivo
#   en endpoints/schemas; cambio masivo y poco valor.
# - B904: raise from None/exc en handlers — refactor por archivo.
# - E741: nombres `l`, `I`, `O` ambiguos — pocos lugares; bajo impacto.
# - RUF002/003: caracteres Unicode "ambiguos" en docstrings/comentarios
#   en español — los acentos son legítimos.
# - RUF012: mutable class defaults sin ClassVar — Pydantic + SQLAlchemy
#   tienen muchos casos válidos; ruido > señal.
# - RUF017: O(n²) sums en listas chicas — perf irrelevante.
# - UP038: `isinstance(x, (A, B))` vs `A | B` — menor.
ignore = [
    "E501",
    "B008",
    "A002",
    "B904",
    "E741",
    "RUF002",
    "RUF003",
    "RUF012",
    "RUF017",
    "UP038",
]

# MCS DEV-04 — «el análisis estático y la verificación de tipos DEBEN
# ejecutarse en modo estricto». `ruff` cubría lo primero y `tsc --noEmit` lo
# segundo en el frontend; en Python no había ni mypy ni pyright.
#
# `strict = true` y no una selección de reglas: el requisito dice estricto, y
# elegir a mano qué partes de estricto se aplican es exactamente la forma de
# declararlo cumplido sin cumplirlo. Lo estricto se ejecuta entero; el pasivo
# heredado vive en `.mypy-baseline`, con fecha y con la regla de que solo puede
# encoger (ver `scripts/check_tipos.py`).
[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
# Los errores se comparan contra la línea base por huella, y la huella no lleva
# número de línea. Sin esto la ruta no siempre aparece y la huella se pierde.
show_error_codes = true
# Sin `exclude`, y es deliberado. `app/scripts/seed_demo.py` invita a quedar
# fuera por ser código de apoyo, pero escribe en la base con las mismas
# entidades que producción: un error de tipos ahí corrompe datos de demo que
# luego se usan para probar. Lo que de verdad se genera —`alembic/versions`—
# ya queda fuera porque `files` apunta solo a `app`.

# Bibliotecas sin `py.typed` ni stubs publicados. Se enumeran una por una a
# propósito: `ignore_missing_imports` global apagaría también el aviso cuando
# entre la séptima, y meter una dependencia sin tipos debe ser una decisión.
[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "celery.*",
    "defusedxml.*",
    "openpyxl.*",
    "passlib.*",
    "weasyprint.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
