[project]
name = "pmoaas-api"
version = "0.1.0"
description = "PMO-aaS FastAPI backend"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "legacy: tests de comportamiento deprecado que se conservan como referencia (ver US-047)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RUF"]
ignore = ["E501", "B008"]
