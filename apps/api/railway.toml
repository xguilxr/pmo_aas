# Railway config del servicio `api`.
#
# Historia:
# - US-048 (2026-04-21): unificó builder a Dockerfile compartido con
#   el worker (el worker traía sidecar Tailscale).
# - ENH-023 (2026-04-23): Tailscale retirado del Dockerfile (DEC-017
#   eliminó la dependencia). API sigue usando el Dockerfile compartido
#   porque WeasyPrint necesita libs nativas (BUG-007).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
